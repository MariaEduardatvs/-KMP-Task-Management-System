```html
<!doctype html>

<html>
  <head>

    <title>Task Management</title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-Zenh87qX5JnK2Jl0vWa8Ck2rdkQ2Bzep5IDxbcnCeuOxjzrPF/et3URy9Bv1WTRi"
      crossorigin="anonymous"
    />

    <!-- Bootstrap JavaScript Bundle with Popper -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-OERcA2EqJCMA+/3y+gxIOqMEjwtxJY7qPCqsdltbNJuaOe923+mo//f6V8Qbsw3"
      crossorigin="anonymous"
    ></script>

    <!-- CSS -->
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}"
    />
  </head>

  <body>
    <header>
      <nav>
        <div class="d-none d-lg-block">
          <ul class="d-inline-flex mb-0 list-unstyled">

            <!-- Home -->
            <li class="nav-item me-3">
              <a
                class="nav-link btn btn-warning p-2 text-dark fw-bold"
                href="/"
              >
                Home
              </a>
            </li>

            <!-- Create Task -->
            <li class="nav-item me-3">
              <a
                class="nav-link btn btn-outline-warning p-2 text-white"
                href="/tasks"
              >
                Create Task
              </a>
            </li>

            <!-- Login -->
            <li class="nav-item me-3">
              <a
                class="nav-link btn btn-outline-warning p-2 text-white"
                href="/login"
              >
                Login
              </a>
            </li>

            <!-- Register -->
            <li class="nav-item me-3">
              <a
                class="nav-link btn btn-outline-warning p-2 text-white"
                href="/register"
              >
                Register
              </a>
            </li>

          </ul>
        </div>
      </nav>
    </header>

    <main>
      <div class="container mt-5">

        <h1 class="text-light">
          Task Management
        </h1>

        {% if tasks %}

          <div class="row mt-4">

            {% for task in tasks %}

              <div class="col-md-4 mb-3">

                <div class="card">

                  <div class="card-body">

                    <h5 class="card-title">
                      {{ task.title }}
                    </h5>

                    <p class="card-text">
                      {{ task.description }}
                    </p>

                  </div>

                </div>

              </div>

            {% endfor %}

          </div>

        {% else %}

          <p class="text-light mt-4">
            No tasks available.
          </p>

        {% endif %}

      </div>
    </main>
  </body>
</html>
```
