<!DOCTYPE html>

<html>

<head>

<meta charset="UTF-8">

<title>Login</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="style.css">

</head>

<body class="container mt-5">

<h2 class="text-light">Login</h2>

<form id="loginForm">

<div class="mb-3">

<label class="text-light">

Username

</label>

<input
id="loginUsername"
class="form-control"
required>

</div>

<div class="mb-3">

<label class="text-light">

Password

</label>

<input
type="password"
id="loginPassword"
class="form-control"
required>

</div>

<button class="btn btn-warning">

Login

</button>

</form>

<script src="auth.js"></script>

</body>

</html>
